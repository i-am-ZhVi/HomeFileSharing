services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  alembic_upgrade:
    build: .
    container_name: alembic_migrator
    env_file:
      - .env
    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    command: /app/.venv/bin/alembic upgrade head

  backend:
    build: .
    container_name: backend_home_file_sharing
    ports:
      - "${API_PORT}:8000"
    env_file:
      - .env
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      alembic_upgrade:
        condition: service_completed_successfully

volumes:
  postgres_data:
